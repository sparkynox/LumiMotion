plugins {
    id 'fabric-loom' version '1.14.10'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // compile-time only - lets us use the Mod Menu API without forcing players to install it
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    // Loom's old annotation-processor-based refmap generation only runs off JavaCompile,
    // so a pure-Kotlin source set (no .java files) never triggers it and mixins fail to
    // resolve at runtime with "No refMap loaded". TinyRemapper-based remapping handles
    // Kotlin correctly, which is what this turns on.
    mixin {
        useLegacyMixinAp = false
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

kotlin {
    jvmToolchain(21)
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
